services:
  # Backend API Service
  - type: web
    name: himalayan-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*" # You can restrict this to the frontend URL after it's generated by Render
      - key: DATABASE_URL
        value: sqlite:///./himalayan_ai.db # Change this if you use PostgreSQL in production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Frontend Web Service
  - type: web
    name: himalayan-ai-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false # Set this in Render dashboard to: https://your-backend-url.onrender.com
      - key: NEXT_PUBLIC_ENV
        value: production
