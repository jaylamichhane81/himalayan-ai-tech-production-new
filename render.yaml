services:
  # Backend API Service
  - type: web
    name: himalayan-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://himalayan-ai-tech-pro.vercel.app,https://your-render-frontend-url.onrender.com
      - key: DATABASE_URL
        sync: false # Set in Render dashboard - use PostgreSQL for production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@himalayanaitech.com
      - key: ADMIN_EMAIL
        sync: false

  # Frontend Web Service
  - type: web
    name: himalayan-ai-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://himalayan-ai-backend.onrender.com
      - key: NEXT_PUBLIC_ENV
        value: production
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        value: "9779849745629"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://himalayan-ai-tech-pro.vercel.app
